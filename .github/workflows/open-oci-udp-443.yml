name: Open OCI UDP 443

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}

jobs:
  open-udp-443:
    runs-on: ubuntu-latest
    steps:
      - name: Cache OCI CLI install
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-oci-cli-v2

      - name: Add user bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install --user oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "${{ secrets.OCI_CLI_KEY_CONTENT }}" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=$HOME/.oci/oci_api_key.pem
          region=${{ secrets.OCI_CLI_REGION }}
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: Ensure UDP 443 ingress rule
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${OCI_SUBNET_ID:-}" ]; then
            vcn_id=$(oci network vcn list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --query 'data[0].id' \
              --raw-output)

            OCI_SUBNET_ID=$(oci network subnet list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --vcn-id "$vcn_id" \
              | jq -r '.data[] | select(."prohibit-public-ip-on-vnic" == false) | .id' \
              | head -n 1)
          fi

          if [ -z "${OCI_SUBNET_ID:-}" ] || [ "$OCI_SUBNET_ID" = "null" ]; then
            echo "No public subnet resolved."
            exit 1
          fi

          subnet_json=$(oci network subnet get --subnet-id "$OCI_SUBNET_ID")
          security_list_id=$(printf '%s' "$subnet_json" | jq -r '.data."security-list-ids"[0]')

          if [ -z "${security_list_id:-}" ] || [ "$security_list_id" = "null" ]; then
            echo "No security list resolved for subnet."
            exit 1
          fi

          oci network security-list get \
            --security-list-id "$security_list_id" \
            > security-list.json

          jq '.data."ingress-security-rules"' security-list.json > ingress.json
          jq '.data."egress-security-rules"' security-list.json > egress.json

          if jq -e '
            any(.[]; (
              .protocol == "all" or
              (
                .protocol == "17" and
                .source == "0.0.0.0/0" and
                (
                  (."udp-options" == null) or
                  (
                    (."udp-options"."destination-port-range".min // 0) <= 443 and
                    (."udp-options"."destination-port-range".max // 65535) >= 443
                  )
                )
              )
            ))
          ' ingress.json >/dev/null; then
            echo "UDP 443 ingress already allowed."
            exit 0
          fi

          jq '. + [{
            "description": "Allow Hysteria2 UDP 443",
            "is-stateless": false,
            "protocol": "17",
            "source": "0.0.0.0/0",
            "source-type": "CIDR_BLOCK",
            "udp-options": {
              "destination-port-range": {
                "min": 443,
                "max": 443
              }
            }
          }]' ingress.json > ingress-new.json

          oci network security-list update \
            --security-list-id "$security_list_id" \
            --ingress-security-rules file://ingress-new.json \
            --egress-security-rules file://egress.json \
            --force \
            >/dev/null

          echo "UDP 443 ingress rule added."
