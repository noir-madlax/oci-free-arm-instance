name: Monitor OCI A1 Creation Success

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Restore notification state
        uses: actions/cache@v4
        with:
          path: .github/oci-monitor-state
          key: oci-a1-success-notify-state-v1

      - name: Check latest OCI creation result
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          WORKFLOW_NAME="Try to Create OCI A1 VM"
          WORKFLOW_ID=""
          WORKFLOW_FILE="create-vm.yml"
          RETRY_COUNT=4
          RETRY_BASE_SECONDS=2

          run_with_retry() {
            local -a cmd=("$@")
            local attempt=1
            local sleep_seconds=$RETRY_BASE_SECONDS
            local output=""

            while true; do
              if output="$("${cmd[@]}" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi

              if [ "$attempt" -ge "$RETRY_COUNT" ]; then
                echo "WARN: command failed after $attempt attempts: ${cmd[*]}" >&2
                echo "$output" >&2
                return 1
              fi

              echo "WARN: command failed (attempt $attempt/$RETRY_COUNT): ${cmd[*]}" >&2
              echo "$output" >&2
              attempt=$((attempt + 1))
              sleep "$sleep_seconds"
              sleep_seconds=$((sleep_seconds * 2))
            done
          }

          extract_result_from_log() {
            local log_text="$1"
            printf '%s' "$log_text" \
              | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' \
              | awk '/Result:/{line=$0} END{print line}' \
              | sed -E 's/.*Result:[[:space:]]*//'
          }

          fetch_run_result() {
            local run_id="$1"
            local log_text=""
            local result=""

            if log_text="$(run_with_retry gh run view --repo "$TARGET_REPO" "$run_id" --log 2>/dev/null)"; then
              result="$(extract_result_from_log "$log_text")"
              printf '%s\n' "$result"
              return 0
            fi

            local job_id=""
            if job_id="$(run_with_retry gh api "repos/$TARGET_REPO/actions/runs/$run_id/jobs" --jq '.jobs[0].id' 2>/dev/null || true)"; then
              if [ -n "$job_id" ] && [ "$job_id" != "null" ]; then
                if log_text="$(run_with_retry gh api "repos/$TARGET_REPO/actions/jobs/$job_id/logs" 2>/dev/null)"; then
                  result="$(extract_result_from_log "$log_text")"
                  printf '%s\n' "$result"
                  return 0
                fi
              fi
            fi

            return 1
          }

          log_lookup_result() {
            local mode="$1"
            local payload="$2"

            if [ -n "$payload" ] && [ "$payload" != "null" ]; then
              LOOKUP_MODE="$mode"
              echo "Lookup mode=$mode => hit"
            else
              echo "Lookup mode=$mode => no match"
            fi
          }

          LOOKUP_MODE="unset"

          mkdir -p .github/oci-monitor-state
          STATE_FILE=".github/oci-monitor-state/last_notified_run_id"
          PREV_REPORTED=""
          if [ -f "$STATE_FILE" ]; then
            PREV_REPORTED="$(cat "$STATE_FILE")"
          fi

          echo "Workflow check target: name='$WORKFLOW_NAME', file='$WORKFLOW_FILE'"

          WORKFLOW_ID=$(run_with_retry gh api "repos/$TARGET_REPO/actions/workflows/$WORKFLOW_FILE" --jq ".id // empty" 2>/dev/null || true)
          if [ -n "$WORKFLOW_ID" ] && [ "$WORKFLOW_ID" != "null" ]; then
            echo "Resolved workflow id from file: $WORKFLOW_ID"
          else
            echo "Could not resolve workflow id by file; fallback to workflow list by name."
            WORKFLOW_ID=$(run_with_retry gh api "repos/$TARGET_REPO/actions/workflows" \
              --jq "[.workflows[] | select(.name == \"$WORKFLOW_NAME\") | .id][0]" 2>/dev/null || true)
          fi

          if [ -n "$WORKFLOW_ID" ] && [ "$WORKFLOW_ID" != "null" ]; then
            LATEST_RUN_JSON=$(run_with_retry gh api "repos/$TARGET_REPO/actions/workflows/$WORKFLOW_ID/runs?status=completed&per_page=1" \
              --jq "{ id: .workflow_runs[0].id // empty, databaseId: .workflow_runs[0].id // empty, created_at: .workflow_runs[0].created_at // empty, createdAt: .workflow_runs[0].created_at // empty, status: .workflow_runs[0].status // empty, conclusion: .workflow_runs[0].conclusion // empty, url: .workflow_runs[0].url // empty, name: .workflow_runs[0].name // empty }" 2>/dev/null || true)
            log_lookup_result "workflow_runs_by_id" "$LATEST_RUN_JSON"
          fi

          if [ -z "${LATEST_RUN_JSON:-}" ] || [ "$LATEST_RUN_JSON" = "null" ]; then
            LATEST_RUN_JSON=$(run_with_retry gh api "repos/$TARGET_REPO/actions/runs?status=completed&per_page=100" \
              --jq ".workflow_runs | map(select(.name == \"$WORKFLOW_NAME\"))[0]" 2>/dev/null || true)
            log_lookup_result "actions_runs_name_filter" "$LATEST_RUN_JSON"
          fi

          if [ -z "${LATEST_RUN_JSON:-}" ] || [ "$LATEST_RUN_JSON" = "null" ]; then
            LATEST_RUN_JSON=$(run_with_retry gh api "repos/$TARGET_REPO/actions/runs?status=completed&per_page=100" \
              --jq ".workflow_runs | map(select(.path == \".github/workflows/$WORKFLOW_FILE\"))[0]" 2>/dev/null || true)
            log_lookup_result "actions_runs_path_filter" "$LATEST_RUN_JSON"
          fi

          if [ -z "${LATEST_RUN_JSON:-}" ] || [ "$LATEST_RUN_JSON" = "null" ]; then
            LATEST_RUN_JSON=$(run_with_retry gh run list \
              --repo "$TARGET_REPO" \
              --status completed \
              --limit 40 \
              --json databaseId,createdAt,status,conclusion,url,name \
              --jq "map(select(.name == \"$WORKFLOW_NAME\"))[0]" 2>/dev/null || true)
            log_lookup_result "run_list_name_filter" "$LATEST_RUN_JSON"
          fi

          LATEST_RUN_ID=$(printf '%s' "$LATEST_RUN_JSON" | jq -r '.id // .databaseId // empty')
          LATEST_RUN_URL=$(printf '%s' "$LATEST_RUN_JSON" | jq -r '.url // empty')
          LATEST_RUN_CREATED=$(printf '%s' "$LATEST_RUN_JSON" | jq -r '.created_at // .createdAt // empty')
          LATEST_RUN_STATUS=$(printf '%s' "$LATEST_RUN_JSON" | jq -r '.status // empty')
          LATEST_RUN_CONCLUSION=$(printf '%s' "$LATEST_RUN_JSON" | jq -r '.conclusion // empty')
          LATEST_RUN_NAME=$(printf '%s' "$LATEST_RUN_JSON" | jq -r '.name // empty')
          echo "Resolved run summary: id=$LATEST_RUN_ID status=$LATEST_RUN_STATUS conclusion=$LATEST_RUN_CONCLUSION name=$LATEST_RUN_NAME lookup=$LOOKUP_MODE created_at=$LATEST_RUN_CREATED url=${LATEST_RUN_URL:-}"
          if [ -z "$LATEST_RUN_ID" ] || [ "$LATEST_RUN_ID" = "null" ]; then
            echo "No completed run found for workflow. LOOKUP_MODE=$LOOKUP_MODE, workflow_name=$WORKFLOW_NAME, workflow_file=$WORKFLOW_FILE, workflow_id=$WORKFLOW_ID"
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
            echo "run_id=unknown" >> "$GITHUB_OUTPUT"
            echo "result=unknown" >> "$GITHUB_OUTPUT"
            echo "created_at=unknown" >> "$GITHUB_OUTPUT"
            echo "url=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RAW_RESULT=$(fetch_run_result "$LATEST_RUN_ID" || true)

          RESULT=$(printf '%s' "$RAW_RESULT" | tr -d '\r' | tr -d '\n')
          if [ -z "$RESULT" ]; then
            RESULT="unknown"
          fi

          SHOULD_NOTIFY="false"
          if [ "$RESULT" = "created" ] || [ "$RESULT" = "already-running" ]; then
            if [ "$LATEST_RUN_ID" != "$PREV_REPORTED" ]; then
              SHOULD_NOTIFY="true"
              echo "$LATEST_RUN_ID" > "$STATE_FILE"
            fi
          fi

          SHOULD_NOTIFY="${SHOULD_NOTIFY:-false}"

          echo "should_notify=$SHOULD_NOTIFY" >> "$GITHUB_OUTPUT"
          echo "run_id=$LATEST_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "created_at=$LATEST_RUN_CREATED" >> "$GITHUB_OUTPUT"
          echo "url=$LATEST_RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Feishu (10 times)
        if: steps.check.outputs.should_notify == 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          WEBHOOK_URL="$FEISHU_WEBHOOK_URL"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL is empty; skipping notification."
            exit 0
          fi

          TEXT="OCI A1 VM 创建成功（创建流程）\nrun_id=${{ steps.check.outputs.run_id }}\ncreated_at=${{ steps.check.outputs.created_at }}\nresult=${{ steps.check.outputs.result }}\nlink=${{ steps.check.outputs.url }}"
          for i in {1..10}; do
            payload=$(jq -nc --arg text "$TEXT" '{msg_type: "text", content: {text: $text}}')
            curl -fsS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"
          done

      - name: Save notification state
        if: always()
        uses: actions/cache@v4
        with:
          path: .github/oci-monitor-state
          key: oci-a1-success-notify-state-v1
