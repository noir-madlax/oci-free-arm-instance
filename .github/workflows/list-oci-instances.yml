name: List OCI Instances

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  PYTHONWARNINGS: "ignore::FutureWarning"

jobs:
  list-instances:
    runs-on: ubuntu-latest
    steps:
      - name: Cache OCI CLI install
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-oci-cli-v2

      - name: Add user bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install --user oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "${{ secrets.OCI_CLI_KEY_CONTENT }}" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=$HOME/.oci/oci_api_key.pem
          region=${{ secrets.OCI_CLI_REGION }}
          EOF
          chmod 600 "$HOME/.oci/config"

      - name: List non-terminated compute instances
        shell: bash
        run: |
          set -euo pipefail

          oci compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --all \
            --output json \
            > instances.json \
            2> oci-stderr.log

          if [ -s oci-stderr.log ]; then
            echo "OCI_CLI_STDERR_BEGIN"
            sed -E 's/ocid1\.[[:alnum:]._-]+/***OCID_MASKED***/g' oci-stderr.log
            echo "OCI_CLI_STDERR_END"
          fi

          if [ ! -s instances.json ]; then
            echo "OCI_RESPONSE_FORMAT=empty"
            echo "NON_TERMINATED_INSTANCE_COUNT=0"
            echo "NO_NON_TERMINATED_INSTANCES"
            exit 0
          fi

          source_format=$(jq -r '
            if type == "object" and (.data | type == "array") then "object_data_array"
            elif type == "array" then "top_level_array"
            else "unsupported"
            end
          ' instances.json)
          echo "OCI_RESPONSE_FORMAT=$source_format"

          if [ "$source_format" = "unsupported" ]; then
            echo "UNSUPPORTED_OCI_RESPONSE"
            jq -r 'type as $type | "top_level_type=\($type)", (if $type == "object" then "keys=\(keys | join(","))" else empty end)' instances.json
            exit 1
          fi

          count=$(jq '[
            (if type == "object" then .data else . end)[] |
            select(."lifecycle-state" != "TERMINATED" and ."lifecycle-state" != "TERMINATING")] | length' instances.json)
          echo "NON_TERMINATED_INSTANCE_COUNT=$count"

          if [ "$count" -eq 0 ]; then
            echo "NO_NON_TERMINATED_INSTANCES"
            exit 0
          fi

          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            "display_name" "shape" "state" "public_ip" "private_ip" "availability_domain" "time_created"

          jq -c '
            (if type == "object" then .data else . end)[] |
            select(."lifecycle-state" != "TERMINATED" and ."lifecycle-state" != "TERMINATING")
          ' instances.json | while IFS= read -r instance; do
            instance_id=$(printf '%s' "$instance" | jq -r '.id')
            vnic_json=$(oci compute instance list-vnics --instance-id "$instance_id" --output json)
            public_ip=$(printf '%s' "$vnic_json" | jq -r '(.data // .)[0]."public-ip" // ""')
            private_ip=$(printf '%s' "$vnic_json" | jq -r '(.data // .)[0]."private-ip" // ""')

            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$(printf '%s' "$instance" | jq -r '."display-name"')" \
              "$(printf '%s' "$instance" | jq -r '.shape')" \
              "$(printf '%s' "$instance" | jq -r '."lifecycle-state"')" \
              "$public_ip" \
              "$private_ip" \
              "$(printf '%s' "$instance" | jq -r '."availability-domain"')" \
              "$(printf '%s' "$instance" | jq -r '."time-created"')"
          done
