name: Try to Create OCI A1 VM

on:
  schedule:
    - cron: "3-59/8 * * * *"
  workflow_dispatch:
    inputs:
      ocpus:
        description: "A1.Flex OCPUs"
        required: true
        default: "4"
      memory_gbs:
        description: "A1.Flex memory in GB"
        required: true
        default: "24"
      boot_volume_gbs:
        description: "Boot volume size in GB"
        required: true
        default: "50"
      display_name:
        description: "Instance display name"
        required: true
        default: "oci-free-a1"

concurrency:
  group: oci-a1-create-vm
  cancel-in-progress: false

env:
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  OCI_AD_NAME: ${{ secrets.OCI_AD_NAME }}
  OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
  OCI_MAX_INSTANCES: ${{ secrets.OCI_MAX_INSTANCES || '1' }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  INSTANCE_DISPLAY_NAME: ${{ github.event.inputs.display_name || 'oci-free-a1' }}
  OCPUS: ${{ github.event.inputs.ocpus || '4' }}
  MEMORY_GBS: ${{ github.event.inputs.memory_gbs || '24' }}
  BOOT_VOLUME_GBS: ${{ github.event.inputs.boot_volume_gbs || '50' }}

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Cache OCI CLI install
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-oci-cli-v2

      - name: Add user bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install --user oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "${{ secrets.OCI_CLI_KEY_CONTENT }}" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=$HOME/.oci/oci_api_key.pem
          region=${{ secrets.OCI_CLI_REGION }}
          EOF
          chmod 600 "$HOME/.oci/config"

          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > "$HOME/ssh_public_key.pub"

      - name: Try to create VM
        id: create_vm
        shell: bash
        run: |
          set -euo pipefail

          OCI_MAX_INSTANCES="${OCI_MAX_INSTANCES:-1}"

          resolve_ad_candidates() {
            if [ -n "${OCI_AD_NAME:-}" ]; then
              printf '%s\n' "$OCI_AD_NAME"
              return
            fi

            oci iam availability-domain list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --query 'data[].name' \
              --raw-output
          }

          resolve_subnet() {
            if [ -n "${OCI_SUBNET_ID:-}" ]; then
              return
            fi

            vcn_id=$(oci network vcn list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --query 'data[0].id' \
              --raw-output)

            OCI_SUBNET_ID=$(oci network subnet list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --vcn-id "$vcn_id" \
              | jq -r '.data[] | select(."prohibit-public-ip-on-vnic" == false) | .id' \
              | head -n 1)
          }

          resolve_image() {
            if [ -n "${OCI_IMAGE_ID:-}" ]; then
              return
            fi

            OCI_IMAGE_ID=$(oci compute image list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --operating-system "Oracle Linux" \
              --shape "VM.Standard.A1.Flex" \
              --sort-by TIMECREATED \
              --sort-order DESC \
              --query 'data[0].id' \
              --raw-output)
          }

          classify_output() {
            local output="$1"
            local code
            code=$(printf '%s' "$output" | jq -r '.code // empty' 2>/dev/null || true)
            if [ -n "$code" ] && [ "$code" != "null" ]; then
              case "$code" in
                LimitExceeded) echo "limit" ;;
                InternalError) if printf '%s' "$output" | grep -q 'Out of host capacity'; then echo "capacity"; else echo "error"; fi ;;
                *) echo "error" ;;
              esac
              return
            fi

            if printf '%s' "$output" | jq -e '.data.id' >/dev/null 2>&1; then
              echo "created"
              return
            fi

            if printf '%s' "$output" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "created"
              return
            fi

            if printf '%s' "$output" | grep -qiE 'Out of host capacity|out of capacity'; then
              echo "capacity"
              return
            fi

            if printf '%s' "$output" | grep -qiE 'Too many requests|RequestException|timed out|timeout|connection reset|connection timed out|429'; then
              echo "retry"
              return
            fi

            if printf '%s' "$output" | grep -qiE 'LimitExceeded|service limits|standard-a1-memory-count|standard-a1-core-count'; then
              echo "limit"
              return
            fi

            echo "error"
          }

          current_a1_count() {
            oci compute instance list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --all \
              | jq -r '[.data[] |
                  select(."lifecycle-state" != "TERMINATED" and ."lifecycle-state" != "TERMINATING") |
                  select(.shape == "VM.Standard.A1.Flex")] | length'
          }

          resolve_subnet
          resolve_image

          existing_instance=$(oci compute instance list \
            --compartment-id "$OCI_COMPARTMENT_ID" \
            --display-name "$INSTANCE_DISPLAY_NAME" \
            --all 2>/dev/null \
            | jq -r '.data[] | select(."lifecycle-state" != "TERMINATING" and ."lifecycle-state" != "TERMINATED") | .id' \
            | head -n 1 || true)

          if [ -n "${existing_instance:-}" ] && [ "${existing_instance:-}" != "null" ]; then
            OCI_OUTPUT="Instance already running: $existing_instance"
            RESULT="already-running"
          else
            max_instances=$OCI_MAX_INSTANCES
            if ! [[ "$max_instances" =~ ^[0-9]+$ ]]; then
              max_instances=1
            fi

            current_count=$(current_a1_count)
            if ! [[ "$current_count" =~ ^[0-9]+$ ]]; then
              current_count=0
            fi

            if [ "$current_count" -ge "$max_instances" ] && [ "$max_instances" -gt 0 ]; then
              RESULT="limit"
              OCI_OUTPUT="A1 instance limit reached: $current_count (max=$max_instances)."
            else
              attempt_summary=""
              attempt_ad=""
              RESULT="retry"

              for ad in $(resolve_ad_candidates); do
                attempt_ad="$ad"
                attempt_output=$(oci compute instance launch \
                  --compartment-id "$OCI_COMPARTMENT_ID" \
                  --availability-domain "$ad" \
                  --shape "VM.Standard.A1.Flex" \
                  --shape-config "{\"ocpus\":${OCPUS},\"memoryInGBs\":${MEMORY_GBS}}" \
                  --subnet-id "$OCI_SUBNET_ID" \
                  --image-id "$OCI_IMAGE_ID" \
                  --ssh-authorized-keys-file "$HOME/ssh_public_key.pub" \
                  --assign-public-ip true \
                  --display-name "$INSTANCE_DISPLAY_NAME" \
                  --boot-volume-size-in-gbs "$BOOT_VOLUME_GBS" 2>&1 || true)

                result_try=$(classify_output "$attempt_output")
                attempt_summary="${attempt_summary}${ad}:${result_try} "

                if [ "$result_try" = "created" ]; then
                  RESULT="created"
                  OCI_OUTPUT=$(printf 'AD=%s\n%s\n' "$ad" "$attempt_output")
                  break
                fi

                if [ "$result_try" = "limit" ]; then
                  RESULT="limit"
                  OCI_OUTPUT=$(printf 'AD=%s\n%s\n' "$ad" "$attempt_output")
                  break
                fi

                if [ "$result_try" = "error" ]; then
                  RESULT="error"
                  OCI_OUTPUT=$(printf 'AD=%s\n%s\n' "$ad" "$attempt_output")
                  break
                fi

                if [ "$result_try" = "retry" ] || [ "$result_try" = "capacity" ]; then
                  RESULT="$result_try"
                  OCI_OUTPUT=$(printf 'AD=%s\n%s\n' "$ad" "$attempt_output")
                  # continue trying next AD only for retry/capacity
                fi
              done

              if [ "$RESULT" != "created" ] && [ "$RESULT" != "error" ] && [ "$RESULT" != "limit" ]; then
                OCI_OUTPUT=$(printf 'attempts=%s\n%s\n' "$attempt_summary" "$OCI_OUTPUT")
              fi
            fi
          fi

          # keep old behavior for downstream steps
          [ -n "${attempt_ad:-}" ] || attempt_ad="${OCI_AD_NAME:-unknown}"

          {
            echo "result=$RESULT"
            echo "attempted_ad=$attempt_ad"
            echo "log_data<<EOF"
            echo "$OCI_OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Result: $RESULT"
          echo "$OCI_OUTPUT"

          case "$RESULT" in
            created|capacity|retry|already-running|limit) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Send Discord notification
        if: always() && env.DISCORD_WEBHOOK_URL != ''
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ env.DISCORD_WEBHOOK_URL }}
          color: ${{ steps.create_vm.outputs.result == 'created' && '0x28a745' || (steps.create_vm.outputs.result == 'capacity' || steps.create_vm.outputs.result == 'limit') && '0xffa500' || '0xdc3545' }}
          title: OCI A1 VM Bot
          description: |
            Result: `${{ steps.create_vm.outputs.result }}`

            ```text
            ${{ steps.create_vm.outputs.log_data }}
            ```
